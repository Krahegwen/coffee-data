<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!--
      La tarjeta de enlace, la que sale al pegar la dirección en un chat.
      Se imprime a 1200×630 —el tamaño que piden las plataformas— con el
      Chrome que haya en la máquina, y el PNG se commitea:

        chrome --headless --window-size=1200,630 --force-device-scale-factor=1 \
          --screenshot=web/public/og.png herramientas/og-plantilla.html

      Comprueba el resultado antes de darlo por bueno: `--window-size` fija la
      ventana y no el área de pintado, y hay builds que descuentan el marco y
      dejan la banda de abajo en negro sin que el fichero cambie de tamaño.

      Los colores son los del tema de casa (`web/app/app.vue`) y la tipografía,
      el mismo stack del sistema que usa la app: la tarjeta se parece a lo que
      se abre al pulsarla. Sin ficheros de fuente ni hojas de estilo remotas —
      esto se imprime una vez al año y no vale traerse una dependencia.
    -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #faf7f2;
        color: #2b1d13;
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* El marrón de la marca, en el ángulo por donde cae el agua. */
      .mancha {
        position: absolute;
        width: 760px;
        height: 760px;
        right: -230px;
        bottom: -330px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(139, 90, 43, 0.16) 0%, rgba(139, 90, 43, 0) 68%);
      }

      header,
      footer {
        position: absolute;
        left: 78px;
        right: 78px;
      }

      header {
        top: 68px;
      }

      footer {
        bottom: 68px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        border-top: 1px solid #e6ddd1;
        padding-top: 30px;
      }

      .marca {
        font-size: 21px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #8b5a2b;
      }

      h1 {
        margin-top: 26px;
        font-size: 88px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.04;
        color: #3b2314;
      }

      .lede {
        margin-top: 28px;
        max-width: 820px;
        font-size: 29px;
        line-height: 1.45;
        color: #7a6a5c;
      }

      .metodo {
        display: flex;
        gap: 46px;
      }

      .metodo span {
        display: flex;
        flex-direction: column;
        font-size: 19px;
        color: #7a6a5c;
      }

      .metodo b {
        font-size: 34px;
        font-weight: 700;
        color: #2b1d13;
        letter-spacing: -0.01em;
        line-height: 1.3;
      }

      .dominio {
        font-size: 23px;
        font-weight: 600;
        color: #8b5a2b;
      }
    </style>
  </head>
  <body>
    <div class="mancha"></div>

    <header>
      <p class="marca">V60 · Método 4:6</p>
      <h1>Bitácora de café</h1>
      <p class="lede">
        Registro de extracciones con el método 4:6 de Tetsu Kasuya: una sola variable por taza, y
        qué mover en la siguiente.
      </p>
    </header>

    <footer>
      <div class="metodo">
        <span><b>40 %</b>dulzor y acidez</span>
        <span><b>60 %</b>cuerpo</span>
        <span><b>1</b>variable por taza</span>
      </div>
      <p class="dominio">brew.krahegwen.com</p>
    </footer>
  </body>
</html>
